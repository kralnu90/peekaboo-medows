<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Peekaboo Meadow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A gentle tap-and-find game for little ones. Animals hide in the meadow, everything you tap does something, and nobody ever loses.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#bfe6ff">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Peekaboo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap">
<style>
/* Layout: one full-screen meadow drawn in SVG, laid out to the screen's shape, with a thin HUD over the sky.
   Deliberately one bright daytime look for small children, so it doesn't follow dark mode. */
:root{
  color-scheme:light;
  --sky:#bfe6ff; --ink:#20304a; --sun:#ffd23f; --grass:#6cbf4a; --leaf:#4f9d3a; --coral:#ff6b4a; --cream:#fff8e6;
  --f-kid:"Fredoka","Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--f-kid);
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
#w{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--coral);outline-offset:3px}

/* HUD */
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.hud>*{pointer-events:auto}
.jar{display:flex;gap:2px;background:rgba(255,255,255,.85);border:3px solid var(--ink);border-radius:999px;padding:5px 9px;box-shadow:0 3px 0 var(--ink)}
.jar svg{width:26px;height:26px;display:block}
.jar .slot path{fill:#e8edf2;stroke:#b8c3cf;stroke-width:2}
.jar .slot.on path{fill:var(--sun);stroke:#e09a00}
.jar .slot.on{animation:twinkle .5s ease}
@keyframes twinkle{50%{transform:scale(1.5) rotate(20deg)}}
.ask{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:#fff;border:4px solid var(--ink);border-radius:28px;padding:6px 12px 6px 8px;box-shadow:0 4px 0 var(--ink)}
.ask svg.pic{width:72px;height:72px;display:block}
.ask .q{font-size:34px;font-weight:700;color:var(--coral);line-height:1}
.ask .spk{width:26px;height:26px;opacity:.7}
.ask.wiggle{animation:wig .6s ease}
@keyframes wig{20%{transform:translateX(-50%) rotate(-8deg)}40%{transform:translateX(-50%) rotate(7deg)}60%{transform:translateX(-50%) rotate(-5deg)}80%{transform:translateX(-50%) rotate(3deg)}}
.gear{width:44px;height:44px;border-radius:50%;border:3px solid rgba(32,48,74,.35);background:rgba(255,255,255,.55);display:grid;place-items:center;position:relative;padding:0;touch-action:none}
.gear svg{width:22px;height:22px;opacity:.6}
.gear .ring{position:absolute;inset:-3px;border-radius:50%;border:3px solid var(--coral);clip-path:inset(0 100% 0 0);transition:clip-path 0s}
.gear.holding .ring{clip-path:inset(0 0 0 0);transition:clip-path .9s linear}
.gear-tip{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 60px);font:600 13px/1.2 var(--f-kid);background:#fff;border:2px solid var(--ink);border-radius:10px;padding:5px 8px;pointer-events:none}

/* start screen */
.start{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,rgba(191,230,255,.55),rgba(255,248,230,.55));padding:24px}
.start-card{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.start h1{margin:0;font-size:clamp(40px,11vw,76px);line-height:.95;font-weight:700;color:var(--ink);text-shadow:0 4px 0 #fff;text-wrap:balance}
.start h1 span{color:var(--coral)}
.play{width:clamp(130px,34vw,180px);aspect-ratio:1;border-radius:50%;border:6px solid var(--ink);background:var(--coral);box-shadow:0 8px 0 var(--ink);display:grid;place-items:center;animation:breathe 2.4s ease-in-out infinite;padding:0}
.play svg{width:46%;height:46%;margin-left:8%}
.play:active{transform:translateY(5px);box-shadow:0 3px 0 var(--ink)}
@keyframes breathe{50%{transform:scale(1.06)}}
.start p{margin:0;font-size:17px;font-weight:600;color:#3a4a66;max-width:30ch}

.install-link{background:rgba(255,255,255,.8);border:2px solid var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--ink)}
/* grown-ups panel */
.panel{position:fixed;inset:0;display:grid;place-items:center;background:rgba(32,48,74,.45);padding:20px}
.panel-card{background:var(--cream);border:4px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:20px 20px 18px;width:min(360px,100%);display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-size:26px}
.panel p{margin:0;font-size:14px;font-weight:600;color:#55607a;font-family:system-ui,sans-serif}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 12px;font-size:18px;font-weight:600;width:100%;text-align:left}
.tog i{flex:0 0 auto;width:52px;height:30px;border-radius:999px;background:#c9d2dc;position:relative;border:2px solid var(--ink);transition:background .15s}
.tog i::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:transform .15s}
.tog[aria-pressed="true"] i{background:var(--grass)}
.tog[aria-pressed="true"] i::after{transform:translateX(22px)}
.done{align-self:flex-end;background:var(--coral);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:10px 20px;font-size:18px;font-weight:700;box-shadow:0 4px 0 var(--ink)}

/* scene bits */
.rays{animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.drift{animation:drift 9s ease-in-out infinite alternate}
.drift.b{animation-duration:12s;animation-delay:-4s}
@keyframes drift{to{transform:translateX(30px)}}
@media (prefers-reduced-motion:reduce){.rays,.drift,.play{animation:none}}
</style>
</head>
<body>
<svg id="w" role="application" aria-label="Peekaboo Meadow. Tap anything in the meadow.">
  <defs id="defs"></defs>
  <g id="scene"></g>
</svg>

<div class="hud">
  <div class="jar" id="jar" aria-label="Stars collected"></div>
  <button class="ask" id="ask" type="button" aria-label="Say it again" hidden>
    <svg class="pic" viewBox="-70 -150 140 160" aria-hidden="true"><use id="askUse" href="#a-bunny"/></svg>
    <span class="q" aria-hidden="true">?</span>
    <svg class="spk" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#20304a"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#20304a" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
  </button>
  <button class="gear" id="gear" type="button" aria-label="Grown-up settings: press and hold">
    <span class="ring" aria-hidden="true"></span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.4 4.6.1-1.1-.1-1.1 2.1-1.6-2-3.5-2.5 1a8 8 0 0 0-1.9-1.1L15.7 3h-4l-.4 2.7a8 8 0 0 0-1.9 1.1l-2.5-1-2 3.5 2.1 1.6-.1 1.1.1 1.1-2.1 1.6 2 3.5 2.5-1a8 8 0 0 0 1.9 1.1l.4 2.7h4l.4-2.7a8 8 0 0 0 1.9-1.1l2.5 1 2-3.5z" fill="#20304a"/></svg>
  </button>
</div>
<div class="gear-tip" id="gearTip" hidden>Grown-ups: press and hold</div>

<div class="start" id="start">
  <div class="start-card">
    <h1>Peekaboo <span>Meadow</span></h1>
    <button class="play" id="playBtn" type="button" aria-label="Play">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5v17a1 1 0 0 0 1.5.9l14-8.5a1 1 0 0 0 0-1.8l-14-8.5A1 1 0 0 0 5 3.5z" fill="#fff" stroke="#20304a" stroke-width="1.5" stroke-linejoin="round"/></svg>
    </button>
    <p>Tap anything in the meadow. Turn the sound up!</p>
    <button class="install-link" type="button" data-install>Grown-ups: install on this device</button>
  </div>
</div>

<div class="panel" id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="panelH">
  <div class="panel-card">
    <h2 id="panelH">For grown-ups</h2>
    <p>Everything here is free, with no ads, no chat and nothing to buy. Progress stays on this device.</p>
    <button class="tog" type="button" id="tSound" aria-pressed="true">Sounds <i aria-hidden="true"></i></button>
    <button class="tog" type="button" id="tVoice" aria-pressed="true">Talking voice <i aria-hidden="true"></i></button>
    <button class="tog" type="button" id="tFind" aria-pressed="true">Find-the-animal game <i aria-hidden="true"></i></button>
    <button class="tog" type="button" data-install>Install on this device <span aria-hidden="true">⬇</span></button>
    <button class="done" type="button" id="panelDone">Back to the meadow</button>
  </div>
</div>

<script>
(()=>{
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const svg=$('w'),scene=$('scene'),defs=$('defs');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function S(tag,attrs,parent){const e=document.createElementNS(NS,tag);if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function anim(el,kf,o){try{return el.animate(kf,Object.assign({fill:'none'},o,reduce?{duration:Math.min(o.duration,400)}:{}))}catch(e){return{finished:Promise.resolve(),cancel(){}}}}
const later=(ms,f)=>setTimeout(f,ms);

/* settings */
let opts={sound:true,voice:true,find:true};
try{Object.assign(opts,JSON.parse(localStorage.getItem('peekaboo-opts')||'{}'))}catch(e){}
const saveOpts=()=>{try{localStorage.setItem('peekaboo-opts',JSON.stringify(opts))}catch(e){}};

/* ---------- drawings (unit space: anchor at bottom centre, about 100 tall) ---------- */
const O='stroke="#20304a" stroke-width="3" stroke-linejoin="round"';
function spikes(){let d='M-48 0 ';for(let i=0;i<=14;i++){const a=Math.PI-(i/14)*Math.PI,r=i%2?52:66;d+=`L${(-4+r*Math.cos(a)).toFixed(1)} ${(-r*Math.sin(a)*0.95).toFixed(1)} `}return d+'Z'}
defs.innerHTML=`
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd8ff"/><stop offset="1" stop-color="#e4f5ff"/></linearGradient>
<radialGradient id="water" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#8fdcff"/><stop offset="1" stop-color="#3aa6dd"/></radialGradient>
<g id="a-bunny">
  <g transform="rotate(-10 -11 -108)"><ellipse cx="-11" cy="-108" rx="9" ry="25" fill="#f6f1e8" ${O}/><ellipse cx="-11" cy="-106" rx="4" ry="16" fill="#ffb3c1"/></g>
  <g transform="rotate(10 11 -108)"><ellipse cx="11" cy="-108" rx="9" ry="25" fill="#f6f1e8" ${O}/><ellipse cx="11" cy="-106" rx="4" ry="16" fill="#ffb3c1"/></g>
  <ellipse cx="0" cy="-28" rx="30" ry="28" fill="#f6f1e8" ${O}/>
  <ellipse cx="-14" cy="-3" rx="11" ry="6" fill="#f6f1e8" ${O}/><ellipse cx="14" cy="-3" rx="11" ry="6" fill="#f6f1e8" ${O}/>
  <circle cx="0" cy="-68" r="25" fill="#f6f1e8" ${O}/>
  <circle cx="-9" cy="-72" r="4" fill="#20304a"/><circle cx="9" cy="-72" r="4" fill="#20304a"/><circle cx="-8" cy="-73.5" r="1.4" fill="#fff"/><circle cx="10" cy="-73.5" r="1.4" fill="#fff"/>
  <ellipse cx="0" cy="-63" rx="3.5" ry="2.5" fill="#ff8fa3"/><path d="M-5 -58 Q0 -54 0 -60 Q0 -54 5 -58" fill="none" stroke="#20304a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="-16" cy="-62" r="4.5" fill="#ffb3c1" opacity=".7"/><circle cx="16" cy="-62" r="4.5" fill="#ffb3c1" opacity=".7"/>
</g>
<g id="a-hedgehog">
  <path d="${spikes()}" fill="#8a5a3b" ${O}/>
  <ellipse cx="-4" cy="-8" rx="40" ry="9" fill="#a8744f"/>
  <path d="M12 -2 Q8 -46 34 -48 Q50 -46 62 -26 Q50 -6 30 -4 Z" fill="#ecc9a0" ${O}/>
  <circle cx="34" cy="-34" r="4" fill="#20304a"/><circle cx="35" cy="-35.5" r="1.4" fill="#fff"/>
  <circle cx="62" cy="-26" r="5" fill="#20304a"/>
  <circle cx="40" cy="-20" r="5" fill="#ffb3c1" opacity=".7"/>
  <ellipse cx="-20" cy="-1" rx="9" ry="5" fill="#6b4329"/><ellipse cx="18" cy="-1" rx="9" ry="5" fill="#6b4329"/>
</g>
<g id="a-fox">
  <g transform="rotate(-25 -32 -24)"><ellipse cx="-34" cy="-24" rx="26" ry="12" fill="#ef7a2e" ${O}/><ellipse cx="-52" cy="-24" rx="9" ry="9" fill="#fff"/></g>
  <ellipse cx="0" cy="-28" rx="26" ry="28" fill="#ef7a2e" ${O}/>
  <ellipse cx="0" cy="-22" rx="14" ry="18" fill="#fff4e8"/>
  <path d="M-22 -80 L-16 -112 L-2 -90 Z" fill="#ef7a2e" ${O}/><path d="M22 -80 L16 -112 L2 -90 Z" fill="#ef7a2e" ${O}/>
  <path d="M-16 -86 L-14 -104 L-7 -92 Z" fill="#5a2f1b"/><path d="M16 -86 L14 -104 L7 -92 Z" fill="#5a2f1b"/>
  <circle cx="0" cy="-70" r="25" fill="#ef7a2e" ${O}/>
  <path d="M-24 -66 Q-12 -46 0 -54 Q12 -46 24 -66 Q12 -58 0 -60 Q-12 -58 -24 -66 Z" fill="#fff4e8"/>
  <circle cx="-9" cy="-74" r="4" fill="#20304a"/><circle cx="9" cy="-74" r="4" fill="#20304a"/><circle cx="-8" cy="-75.5" r="1.4" fill="#fff"/><circle cx="10" cy="-75.5" r="1.4" fill="#fff"/>
  <circle cx="0" cy="-60" r="4.5" fill="#20304a"/>
  <ellipse cx="-12" cy="-3" rx="9" ry="5" fill="#5a2f1b"/><ellipse cx="12" cy="-3" rx="9" ry="5" fill="#5a2f1b"/>
</g>
<g id="a-frog">
  <ellipse cx="-30" cy="-4" rx="14" ry="6" fill="#4f9d3a" ${O}/><ellipse cx="30" cy="-4" rx="14" ry="6" fill="#4f9d3a" ${O}/>
  <ellipse cx="0" cy="-26" rx="40" ry="26" fill="#63b84a" ${O}/>
  <ellipse cx="0" cy="-18" rx="26" ry="13" fill="#c9eaa8"/>
  <circle cx="-18" cy="-50" r="14" fill="#63b84a" ${O}/><circle cx="18" cy="-50" r="14" fill="#63b84a" ${O}/>
  <circle cx="-18" cy="-51" r="9" fill="#fff"/><circle cx="18" cy="-51" r="9" fill="#fff"/>
  <circle cx="-17" cy="-51" r="4.5" fill="#20304a"/><circle cx="19" cy="-51" r="4.5" fill="#20304a"/>
  <path d="M-16 -32 Q0 -20 16 -32" fill="none" stroke="#20304a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="-26" cy="-30" r="4.5" fill="#ffb3c1" opacity=".7"/><circle cx="26" cy="-30" r="4.5" fill="#ffb3c1" opacity=".7"/>
</g>
<g id="a-bird">
  <path d="M-22 -30 L-42 -42 L-40 -22 Z" fill="#2f7fbd" ${O}/>
  <circle cx="0" cy="-32" r="27" fill="#4aa3df" ${O}/>
  <ellipse cx="7" cy="-23" rx="15" ry="13" fill="#d4ecfb"/>
  <path class="wing" d="M-18 -34 Q-6 -52 8 -34 Q-6 -26 -18 -34 Z" fill="#2f7fbd" ${O}/>
  <path d="M25 -38 L40 -32 L25 -27 Z" fill="#ffa62b" ${O}/>
  <circle cx="11" cy="-40" r="4" fill="#20304a"/><circle cx="12" cy="-41.5" r="1.4" fill="#fff"/>
  <path d="M-4 -5 L-6 2 M6 -5 L4 2" stroke="#ffa62b" stroke-width="3" stroke-linecap="round"/>
</g>
<g id="a-butterfly">
  <g class="wl"><ellipse cx="-15" cy="-10" rx="16" ry="14" fill="#ff8fc7" ${O}/><ellipse cx="-11" cy="10" rx="11" ry="10" fill="#c38bff" ${O}/></g>
  <g class="wr"><ellipse cx="15" cy="-10" rx="16" ry="14" fill="#ff8fc7" ${O}/><ellipse cx="11" cy="10" rx="11" ry="10" fill="#c38bff" ${O}/></g>
  <ellipse cx="0" cy="0" rx="4" ry="18" fill="#20304a"/>
  <path d="M-2 -16 Q-8 -28 -12 -30 M2 -16 Q8 -28 12 -30" stroke="#20304a" stroke-width="2" fill="none" stroke-linecap="round"/>
</g>
<path id="star" d="M0 -10 L2.9 -3.6 L9.5 -3.1 L4.5 1.3 L5.9 8.1 L0 4.6 L-5.9 8.1 L-4.5 1.3 L-9.5 -3.1 L-2.9 -3.6 Z"/>
`;
const ANIMALS=['bunny','hedgehog','fox','frog','bird'];
const NAMES={bunny:'bunny',hedgehog:'hedgehog',fox:'fox',frog:'frog',bird:'bird'};

/* ---------- sound ---------- */
let ac=null,noise=null;
function A(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(ac.state==='suspended')ac.resume();return ac}
function tone(f,dur,o={}){if(!opts.sound)return;const c=A();if(!c)return;const t=c.currentTime+(o.delay||0);const os=c.createOscillator(),g=c.createGain();
  os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);if(o.slide)os.frequency.exponentialRampToValueAtTime(o.slide,t+dur);
  const v=o.vol??.18;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  os.connect(g).connect(c.destination);os.start(t);os.stop(t+dur+.03)}
function hiss(dur,o={}){if(!opts.sound)return;const c=A();if(!c)return;if(!noise){noise=c.createBuffer(1,c.sampleRate,c.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  const t=c.currentTime+(o.delay||0),s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=noise;f.type=o.type||'bandpass';f.frequency.value=o.freq||1500;f.Q.value=o.q||1;
  g.gain.setValueAtTime(o.vol||.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f).connect(g).connect(c.destination);s.start(t,Math.random()*.5);s.stop(t+dur+.02)}
const PENTA=[523,587,659,784,880,1047,1175,1319];let noteI=0;
const SFX={
  pop:()=>{tone(320,.14,{slide:980,vol:.2});hiss(.05,{freq:3000,vol:.08})},
  giggle:()=>[0,.09,.18,.27,.36].forEach((d,i)=>tone(880+i*90,.07,{delay:d,slide:1200+i*90,vol:.12})),
  boing:()=>tone(180,.35,{slide:520,type:'triangle',vol:.2}),
  ribbit:()=>{tone(150,.11,{type:'square',vol:.06,slide:120});tone(170,.14,{type:'square',vol:.06,delay:.16,slide:130})},
  tweet:()=>[0,.13,.26].forEach(d=>tone(2300,.09,{delay:d,slide:3400,vol:.08})),
  rustle:()=>{hiss(.35,{freq:2500,vol:.1,q:.6});hiss(.25,{freq:1800,vol:.08,delay:.12,q:.6})},
  squeak:f=>tone(f,.13,{slide:f*1.7,vol:.15}),
  snuffle:()=>[0,.1,.2].forEach(d=>hiss(.07,{freq:900,vol:.14,delay:d,q:3})),
  yip:()=>{tone(620,.1,{slide:980,type:'triangle',vol:.16});tone(700,.1,{slide:1050,type:'triangle',vol:.14,delay:.14})},
  drip:d=>tone(1300,.07,{slide:700,vol:.08,delay:d}),
  note:()=>{const f=PENTA[noteI++%PENTA.length];tone(f,.4,{vol:.12});tone(f*2,.25,{vol:.04})},
  cheer:()=>[523,659,784,1047].forEach((f,i)=>{tone(f,.35,{delay:i*.1,vol:.14,type:'triangle'})}),
  fanfare:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i===6?.7:.22,{delay:i*.14,vol:.14,type:'triangle'})),
  splash:()=>{hiss(.4,{freq:1200,vol:.12,type:'lowpass'});tone(500,.15,{slide:200,vol:.08})},
  whoosh:()=>hiss(.5,{freq:700,vol:.07,q:.4})
};

    S('circle',{r:12,fill:'#e8453c',stroke:'#20304a','stroke-width':2.5},g);S('path',{d:'M0 -11 L2 -18',stroke:'#5a3b22','stroke-width':3,'stroke-linecap':'round'},g);S('circle',{cx:-4,cy:-4,r:3,fill:'#fff',opacity:.7},g);g._x=x;g._y=y;return g});

  for(let i=0;i<26;i++){const x=rnd(0,W),y=rnd(gY+U*0.3,H-10);S('path',{d:`M${x} ${y} l-4 -12 M${x} ${y} l3 -14 M${x} ${y} l9 -10`,stroke:'#58a83a','stroke-width':3,'stroke-linecap':'round',fill:'none'},scene)}

  S('path',{d:'M10 2 a40 14 0 1 0 66 -8 L44 -2 Z',fill:'#4f9d3a',stroke:'#20304a','stroke-width':3},pond.inner);

  E.bushes=bpos.map(([x,y],i)=>{const b=hitG('bush',x,y,s*(portrait?1.1:0.95),i);

    [[-58,-34,36],[0,-60,46],[56,-34,36],[-30,-18,30],[30,-18,30],[0,-20,40]].forEach(([cx,cy,r])=>S('circle',{cx,cy,r,fill:'#4f9d3a'},leaves));

function tapFlower(f){anim(f.inner,[{transform:'scale(1) rotate(0)'},{transform:'scale(1.35) rotate(-12deg)'},{transform:'scale(.9) rotate(8deg)'},{transform:'scale(1) rotate(0)'}],{duration:600,easing:'ease-out'});SFX.note();

let birdOut=false;

  want=pick(ANIMALS.filter(a=>a!==lastWant));lastWant=want;$('askUse').setAttribute('href','#a-'+want);const ask=$('ask');ask.hidden=false;ask.classList.remove('wiggle');void ask.offsetWidth;ask.classList.add('wiggle');
  say(`Can you find the ${NAMES[want]}?`);lastTap=Date.now()}
function svgPtFromClient(cx,cy){const p=svg.createSVGPoint();p.x=cx;p.y=cy;return p.matrixTransform(svg.getScreenCTM().inverse())}
function foundIt(at){const name=want;want=null;stars++;
  confetti(at.x,at.y,22);SFX.cheer();later(250,()=>say(`Yay! You found the ${NAMES[name]}!`));
  const slot=jar.children[stars-1].getBoundingClientRect(),tgt=svgPtFromClient(slot.left+slot.width/2,slot.top+slot.height/2);
  const st=fxAt(at.x,at.y,U/25);S('use',{href:'#star',fill:'#ffd23f',stroke:'#e09a00','stroke-width':1.5},st);
  anim(st,[{transform:'translate(0,0) scale(1) rotate(0)'},{transform:`translate(${(tgt.x-at.x)/(U/25)*.5}px,${(tgt.y-at.y)/(U/25)*.5-40}px) scale(1.6) rotate(180deg)`},{transform:`translate(${(tgt.x-at.x)/(U/25)}px,${(tgt.y-at.y)/(U/25)}px) scale(.5) rotate(360deg)`}],{duration:1100,delay:500,easing:'ease-in-out',fill:'forwards'}).finished.then(()=>{st._outer.remove();drawJar()});
  if(stars>=5)later(2600,party);else later(3200,()=>{reshuffle();nextPrompt()})}
function party(){$('ask').hidden=true;SFX.fanfare();say('Hooray! Five stars! You are amazing!');
  for(let k=0;k<12;k++)later(k*180,()=>{const b=balloon(rnd(W*0.05,W*0.95),H+40);});
  for(let k=0;k<4;k++)later(k*400,()=>confetti(rnd(W*0.2,W*0.8),rnd(H*0.15,H*0.45),26));
  later(5200,()=>{stars=0;drawJar();reshuffle();nextPrompt()})}
setInterval(()=>{if(!started||!want||document.hidden)return;if(Date.now()-lastTap<9000)return;lastTap=Date.now();
  const w=whereIs(want);const g=w.type==='bush'?E.bushes[w.i]:w.type==='pond'?E.pond:E.tree;
  anim(g.inner,[{transform:'scale(1)'},{transform:'scale(1.08)'},{transform:'scale(1)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],{duration:900});
  const p=w.type==='tree'?gpos(g,60,-300):gpos(g,0,-60);sparkle(p.x,p.y);say(`Where's the ${NAMES[want]}? Have a look!`)},1000);

/* ---------- input ---------- */
svg.addEventListener('pointerdown',e=>{if(!started)return;e.preventDefault();lastTap=Date.now();A();
  const pt=svgPtFromClient(e.clientX,e.clientY);const hit=e.target.closest('[data-hit]');const type=hit?hit.getAttribute('data-hit'):null,i=hit?+hit.getAttribute('data-i'):0;
  let spot=null;
  if(type==='bush'){spot=bushAnimals[i]}else if(type==='pond'){spot='frog'}else if(type==='tree'){spot='bird'}
  const found=!!(want&&spot===want);
  switch(type){
    case'sun':tapSun();break;
    case'cloud':tapCloud(hit);break;
    case'tree':tapTree(found);break;
    case'bush':tapBush(E.bushes[i],found);break;
    case'pond':tapPond(found,pt);break;
    case'flower':tapFlower(hit);break;
    case'balloon':popBalloon(hit,pt);break;
    default: if(pt.y>gY-U*0.1)sprout(pt.x,pt.y);else balloon(pt.x,pt.y);
  }
  if(found)foundIt(type==='tree'?gpos(E.tree,60,-300):type==='pond'?gpos(E.pond,44,-40):gpos(hit,0,-150))});
svg.addEventListener('contextmenu',e=>e.preventDefault());

$('ask').onclick=()=>{if(!want)return;const a=$('ask');a.classList.remove('wiggle');void a.offsetWidth;a.classList.add('wiggle');say(`Can you find the ${NAMES[want]}?`);SFX.pop()};
$('playBtn').onclick=()=>{A();SFX.cheer();started=true;$('start').hidden=true;drawJar();
  try{const u=new SpeechSynthesisUtterance('');speechSynthesis.speak(u)}catch(e){}
  if(opts.find)later(500,nextPrompt);else later(300,()=>say('Tap anything!'));
  $('gearTip').hidden=false;later(3500,()=>$('gearTip').hidden=true)};

/* grown-up gear: press and hold */
const gear=$('gear');let holdT=null;
function openPanel(){$('panel').hidden=false;['Sound','Voice','Find'].forEach(k=>$('t'+k).setAttribute('aria-pressed',String(opts[k.toLowerCase()])));$('tSound').focus()}
gear.addEventListener('pointerdown',e=>{e.preventDefault();gear.classList.add('holding');holdT=setTimeout(()=>{gear.classList.remove('holding');openPanel()},900)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>gear.addEventListener(ev,()=>{clearTimeout(holdT);gear.classList.remove('holding')}));
gear.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPanel()}});
['Sound','Voice','Find'].forEach(k=>$('t'+k).onclick=()=>{const key=k.toLowerCase();opts[key]=!opts[key];$('t'+k).setAttribute('aria-pressed',String(opts[key]));saveOpts();
  if(key==='voice'&&!opts.voice){try{speechSynthesis.cancel()}catch(e){}}});
$('panelDone').onclick=()=>{$('panel').hidden=true;drawJar();if(opts.find&&!want&&started)nextPrompt();if(!opts.find){want=null;$('ask').hidden=true}};

let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(layout,150)});
layout();drawJar();
/* ambient life: a butterfly now and then, and a gentle rustle as a clue */
setInterval(()=>{if(!started||document.hidden)return;if(Math.random()<.5)butterfly(rnd(W*0.1,W*0.9),rnd(gY,H-U));},7000);
})();
</script>

</style>
<script id="kg-install">
(function(){
  var NAME='Peekaboo Meadow',KEY='pb-install-snooze',AUTO=0;
  var evt=null,sheet=null,root=document.documentElement;
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  function standalone(){return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true}
  function can(){return !standalone()&&(!!evt||ios)}
  function sync(){root.classList.toggle('kg-can-install',can())}
  function snoozed(){try{return Date.now()<(+localStorage.getItem(KEY)||0)}catch(e){return false}}
  function snooze(days){try{localStorage.setItem(KEY,String(Date.now()+days*864e5))}catch(e){}}
  function close(){if(sheet){sheet.remove();sheet=null}}
  function show(auto){close();var iosHelp=!evt&&ios;sheet=document.createElement('div');sheet.className='kg-sheet';sheet.setAttribute('role','dialog');sheet.setAttribute('aria-label','Install '+NAME);
    sheet.innerHTML='<b>Install '+NAME+'?</b><p>'+(iosHelp?'In Safari, tap the <b>Share</b> button, then <b>Add to Home Screen</b>. It then opens full screen and works offline.':'Put it on your home screen and play full screen like a proper app, even without a signal.')+'</p><div class="kg-row"><button type="button" class="kg-no">'+(iosHelp?'Got it':'Not now')+'</button>'+(iosHelp?'':'<button type="button" class="kg-yes">Install</button>')+'</div>';
    document.body.appendChild(sheet);
    sheet.querySelector('.kg-no').onclick=function(){snooze(auto?3:1);close()};
    var y=sheet.querySelector('.kg-yes');if(y){y.onclick=install;y.focus()}}
  function install(){close();var e=evt;evt=null;if(!e){sync();return}e.prompt();Promise.resolve(e.userChoice).then(sync,sync)}
  addEventListener('beforeinstallprompt',function(e){e.preventDefault();evt=e;sync();if(AUTO&&!snoozed())setTimeout(function(){if(evt&&!sheet&&!standalone())show(true)},AUTO)});
  addEventListener('appinstalled',function(){evt=null;sync();close()});
  document.addEventListener('click',function(e){var b=e.target&&e.target.closest&&e.target.closest('[data-install]');if(!b)return;e.preventDefault();e.stopPropagation();if(evt)install();else if(ios)show(false)},true);
  sync();
  window.KralnuInstall={can:can,open:function(){show(false)}};
  if('serviceWorker' in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script>
